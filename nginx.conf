upstream auth_backend {
    server localhost:8000;
}

upstream exam_backend {
    server localhost:8002;
}

upstream ocr_backend {
    server localhost:8003;
}

server {
    listen 80;
    server_name educheck.ai app.educheck.ai api.educheck.ai;
    
    # Redirection HTTPS (production)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name educheck.ai;
    
    # SSL Certificats
    ssl_certificate /etc/nginx/ssl/educheck.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/educheck.ai.key;
    
    # Frontend React
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Auth Service API
    location /api/auth/ {
        proxy_pass http://auth_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Exam Service API
    location /api/exam/ {
        proxy_pass http://exam_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # OCR Service API
    location /api/ocr/ {
        proxy_pass http://ocr_backend/ocr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}